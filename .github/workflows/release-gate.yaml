# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: "Release Gate"
on:
  pull_request:
    branches:
      - "main"
permissions:
  contents: "read"
jobs:
  release-gate:
    name: "LiteLLM bump release gate"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Harden Runner"
        uses: "step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25" # v2.22.1
        with:
          egress-policy: "audit"
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Take the gate from the base branch"
        env:
          BASE_REF: "${{ github.base_ref }}"
        run: |
          gate="$RUNNER_TEMP/release_gate.py"
          if ! git cat-file -e "origin/$BASE_REF:scripts/release_gate.py" 2>/dev/null; then
            echo "::error::origin/$BASE_REF has no scripts/release_gate.py; restore it on $BASE_REF before this check can pass"
            exit 1
          fi
          git show "origin/$BASE_REF:scripts/release_gate.py" > "$gate"
      - name: "Check the middleware is released"
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
          BASE_REF: "${{ github.base_ref }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        run: 'python3 "$RUNNER_TEMP/release_gate.py" --repo . --base "origin/$BASE_REF" --head "$HEAD_SHA"'
      - name: "Detect a LiteLLM bump"
        id: "bump"
        env:
          BASE_REF: "${{ github.base_ref }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        run: |
          if git diff --quiet --no-renames "origin/$BASE_REF...$HEAD_SHA" -- litellm-image.yaml; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi
      - name: "Resolve the middleware release spruyt-labs deploys"
        id: "deployed"
        if: "steps.bump.outputs.bump == 'true'"
        run: |
          image="$(python3 "$RUNNER_TEMP/release_gate.py" --deployed-image)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: "Setup uv"
        if: "steps.bump.outputs.bump == 'true'"
        uses: "astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7" # v10.2.0
        with:
          cache-dependency-glob: "uv.lock"
      - name: "Integration tests against the deployed middleware release"
        if: "steps.bump.outputs.bump == 'true'"
        env:
          LITELLM_IT_PACKAGE_IMAGE: "${{ steps.deployed.outputs.image }}"
        run: |
          echo "::notice::testing the bump against $LITELLM_IT_PACKAGE_IMAGE"
          uv run --frozen --no-build pytest tests/integration
