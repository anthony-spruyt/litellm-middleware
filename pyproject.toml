[project]
name = "litellm-middleware"
version = "0.1.0"
description = "LiteLLM proxy callback pipeline for composable middleware"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# The LiteLLM image's interpreter; its runtime dependencies ship in that image too.
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cryptography>=44",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyyaml>=6",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "E",
    "F",
    "FURB",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PLE",
    "PLW",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "UP",
    "W",
]

[tool.ruff.lint.isort]
known-first-party = ["litellm_middleware"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
