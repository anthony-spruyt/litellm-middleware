[project]
name = "litellm-middleware"
version = "1.7.2"
description = "LiteLLM proxy callback pipeline for composable middleware"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# The LiteLLM image's interpreter; its runtime dependencies ship in that image too.
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cryptography>=44",
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyyaml>=6",
    "ruff>=0.14",
]

[tool.uv]
exclude-newer = "7 days"
# Remove once certifi 2026.10.23 is 7 days old
exclude-newer-package = { certifi = false }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "tests"]
testpaths = ["tests/unit"]

[tool.ruff]
extend = "ruff-base.toml"
target-version = "py313"

[tool.ruff.lint]
extend-select = ["PLR"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"] # expected values in assertions read better inline

[tool.ruff.lint.isort]
known-first-party = ["litellm_middleware"]
